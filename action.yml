name: 'SplitShip'
description: 'On release/tag, generate DEV.md + CUSTOMER.md + LINKEDIN.md + X.md from your commits. Made By Zer01.'
author: 'Zer01'
branding:
  icon: 'ship'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for reading commits and creating files/PRs'
    required: false
    default: ${{ github.token }}
  polar-license-key:
    description: 'Polar license key for SplitShip'
    required: false
  polar-organization-id:
    description: 'Polar organization UUID (defaults to driftwatch-kit org)'
    required: false
  skip-license:
    description: 'Skip Polar license check (dev/CI only)'
    required: false
    default: 'false'
  config-path:
    description: 'Path to splitship.yml config'
    required: false
    default: 'splitship.yml'
  anthropic-api-key:
    description: 'BYOK Anthropic API key (optional; falls back to deterministic mode)'
    required: false
  openai-api-key:
    description: 'BYOK OpenAI API key (optional; falls back to deterministic mode)'
    required: false
  llm-provider:
    description: 'Preferred LLM provider: auto | anthropic | openai | offline (auto prefers anthropic when both keys set)'
    required: false
    default: 'auto'
  output-dir:
    description: 'Directory to write generated markdown files'
    required: false
    default: 'splitship-out'
  tag:
    description: 'Release tag to document (defaults to github.ref_name)'
    required: false
  commit:
    description: 'Commit SHA to create/update files against'
    required: false
  update-release:
    description: 'When true, append/replace CUSTOMER markdown on the published GitHub Release body (<!-- splitship:customer --> markers)'
    required: false
    default: 'true'
  append-changelog:
    description: 'When true, prepend a Keep-a-Changelog section for the tag into CHANGELOG.md (or config changelogPath)'
    required: false
    default: 'true'
  write-x:
    description: 'Write X/Twitter draft (X.md). Default true; also written when config outputs.x is set'
    required: false
    default: 'true'
  create-pr:
    description: 'When true, open a PR on branch splitship/notes-<tag> with generated files (best-effort)'
    required: false
    default: 'false'

outputs:
  dev-path:
    description: 'Path to generated DEV.md'
  customer-path:
    description: 'Path to generated CUSTOMER.md'
  linkedin-path:
    description: 'Path to generated LINKEDIN.md'
  x-path:
    description: 'Path to generated X.md (when write-x or outputs.x)'
  mode:
    description: 'Generation mode used: anthropic | openai | offline'
  pr-url:
    description: 'URL of opened PR when create-pr is true'

runs:
  using: 'node20'
  main: 'dist/index.js'
