name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        env:
          SKIP_LICENSE: '1'
        run: npm test

      - name: Build
        run: npm run build

      - name: Local run smoke
        env:
          SKIP_LICENSE: '1'
        run: npm run local

      - name: Ensure dist committed
        run: |
          git diff --exit-code dist/ || (echo "dist/ out of date — run npm run build" && exit 1)
