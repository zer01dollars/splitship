# SplitShip config — copy to splitship.yml at repo root
# https://github.com/zer01dollars/splitship

outputDir: splitship-out

outputs:
  dev: DEV.md
  customer: CUSTOMER.md
  linkedin: LINKEDIN.md
  # x: X.md   # optional explicit name; write-x input also controls writing

# writeX: true   # default true — set false to skip X.md unless outputs.x is set

# Defaults on: update GitHub Release body + prepend CHANGELOG.md
# updateRelease: true
# appendChangelog: true
# createPr: false   # when true, open PR on splitship/notes-<tag> instead of committing on main

changelogPath: CHANGELOG.md

# polar:
#   organizationId: b6303f05-be1c-4b45-b847-5979667a3d12

llm:
  # auto | offline | anthropic | openai
  # auto prefers anthropic when both API keys are present
  provider: auto
  # model: claude-3-5-haiku-latest
  # model: gpt-4o-mini

tone:
  dev: technical
  customer: friendly
  linkedin: professional

include:
  breaking: true
  commits: true
  authors: true

# Filter commits before generate
# excludeTypes: [chore, ci]
# excludeSubjects:
#   - '^deps:'
#   - 'bump dependencies'
# excludePaths:
#   - package-lock.json
#   - yarn.lock
#   - node_modules/
